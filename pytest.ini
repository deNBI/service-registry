[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
markers =
    allow_status_drift: test deliberately leaves status history inconsistent
    postgres: needs PostgreSQL (row locks, concurrent transactions); skipped on SQLite
addopts = -v --tb=short --cov=apps --cov-report=term-missing --cov-fail-under=80
