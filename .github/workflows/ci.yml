# =============================================================================
# de.NBI Service Registration Platform — GitHub Actions CI
# =============================================================================
# Triggers:
#   push   → main, develop
#   PR     → main
#   manual → workflow_dispatch (for release builds with a custom tag)
#
# Jobs:
#   test    pytest (SQLite, slow tests included) + ruff + pip-audit; runs
#           natively, no Docker
#   test-postgres  the whole suite incl. row-lock and concurrency tests
#                  (make test-postgres) on a PostgreSQL service container
#   build   docker buildx → validates image builds; push to registry (main only)
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push (e.g. v1.4.2)"
        required: false
        default: "latest"

env:
  IMAGE_NAME: denbi-registry
  REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}

jobs:

  #  Test, Lint & Audit — native Python, no Docker required
  test:
    name: Test, Lint & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          SECRET_KEY: ci-only-not-a-real-key
          DB_PASSWORD: unused-in-test
          REDIS_PASSWORD: unused-in-test
        run: pytest tests/ -v --tb=short --cov=apps --cov-report=xml

      # - name: Upload coverage report
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     file: coverage.xml
      #     fail_ci_if_error: false

      - name: Ruff lint
        run: ruff check apps/ config/ tests/

      - name: Ruff format check
        run: ruff format --check apps/ config/ tests/

      - name: pip-audit
        run: pip-audit -r requirements/production.txt

      # The exhaustive lifecycle sequences are marked `slow` and left out of
      # the first run; they come last so that lint and audit results show
      # even when they fail.
      - name: Run slow tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          SECRET_KEY: ci-only-not-a-real-key
          DB_PASSWORD: unused-in-test
          REDIS_PASSWORD: unused-in-test
        run: make test-slow

  #  The whole suite on the production database engine. SQLite ignores row
  #  locks, so the tests marked `postgres` only run here.
  test-postgres:
    name: Test on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: denbi
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: denbi_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denbi -d denbi_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run pytest on PostgreSQL
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_DB_PASSWORD: ci-only-not-a-real-password
          SECRET_KEY: ci-only-not-a-real-key
          DB_PASSWORD: unused-in-test
          REDIS_PASSWORD: unused-in-test
        run: make test-postgres

