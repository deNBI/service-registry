site_name: Service Registration Platform
site_description: Documentation for the de.NBI & ELIXIR-DE Service Registration Platform
site_url: https://denbi.github.io/service-registry/
repo_url: https://github.com/deNBI/service-registry
repo_name: deNBI/service-registry
edit_uri: ""

theme:
  name: material
  font: false # Use system fonts — better performance and no external requests
  logo: https://www.denbi.de/templates/nbimaster/img/denbi-logo-color.svg
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/tablesort.min.js
  - javascripts/tablesort.js

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  superpowers/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting Started:
    - Development Setup: development.md
    - Configuration Reference: configuration.md
    - Deployment Guide: deployment.md
  - User Guide:
    - Registering and Updating a Service: user-guide.md
    - Using the API: api-guide.md
  - Admin Guide:
    - Admin Guide: admin-guide.md
    - Managing API Keys: admin/api-keys.md
    - Admin REST API: admin/api.md
  - Operator Guide:
    - Operator Guide Overview: operator/index.md
    - E-mail and Notifications: operator/email.md
    - Customising Texts: operator/customising-texts.md
    - Reference Data and Ontology Sync: operator/data-sync.md
    - Operations and Monitoring: operator/operations.md
    - Security Operations: operator/security.md
    - Backups: operator/backups.md
    - Releases and Rollback: rollout.md
    - Troubleshooting: operator/troubleshooting.md
  - Developer Guide:
    - Architecture: architecture.md
    - Testing: testing.md
    - Database Schema: database-schema.md
    - Internals:
      - Markdown Rendering: developer/markdown.md
      - Logo Upload Pipeline and Media Serving: developer/logo-pipeline.md
      - Change Tracking and Status Reset: developer/lifecycle.md
      - Frontend Templates, Widgets and Drafts: developer/frontend.md
      - Registry Catalogue Internals: developer/catalogue.md
      - bio.tools Integration Internals: developer/biotools.md
      - Admin Permission Enforcement: developer/admin-permissions.md
      - Vendored Static Assets: developer/vendored-assets.md
    - Extending Models and Database Schema: extending/model-changes.md
    - Adding Apps and Features: extending/adding-apps.md
  - Reference:
    - Hosting the Documentation: docs-hosting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deNBI
    - icon: fontawesome/solid/globe
      link: https://www.denbi.de

